<!doctype html>
<!-- XP-Gliding Flight Computer and Glide Computer: the page shown in X-Plane's browser window
     (adapter/computer.py), in the layout the snapshot names (body[data-layout]).
     Classic scripts only: X-Plane's browser refuses module scripts and fetch() on file:// pages.
     For a desktop browser, open index.html?dev to draw from a fake simulator (dev/fake.js), and
     index.html?dev&offline to see the map with no tiles; &glide for the Glide Computer.
     License: GPL-3.0-or-later. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XP-Gliding Flight Computer</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- The strip: always there, whatever the view. -->
<header id="strip">
  <div class="cell vario">
    <span class="label">TE</span>
    <div class="reading">
      <div class="bar" aria-hidden="true"><div class="zero"></div><div class="fill" id="te-bar"></div></div>
      <span class="value te" id="strip-te">--</span><span class="unit" data-unit="climb"></span>
    </div>
  </div>
  <div class="cell"><span class="label">AVG 30 s</span><div class="reading"><span class="value avg" id="strip-avg">--</span><span class="unit" data-unit="climb"></span></div></div>
  <div class="cell"><span class="label">ALT</span><div class="reading"><span class="value" id="strip-alt">--</span><span class="unit" data-unit="height"></span></div></div>
</header>
<!-- The point flown to, with a task loaded (task.js): which way to turn, its height limits if it
     has some (red while the glider is outside them), its bearing and distance. -->
<div id="navrow">
  <svg class="arrow" id="nav-arrow" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0,-8 L4,1 L1,1 L1,8 L-1,8 L-1,1 L-4,1 Z"/></svg>
  <span id="nav-role"></span><span id="nav-name"></span><span id="nav-limit"></span><span id="nav-bearing"></span><span id="nav-dist"></span>
</div>
<nav id="tabs">
  <button type="button" data-view="map">MAP</button>
  <button type="button" data-view="flight">FLIGHT</button>
  <button type="button" data-view="task">TASK</button>
  <span id="clock" title="Local time in the simulator">--:--</span>
</nav>
<!-- MAP: Leaflet draws in it (map.js). -->
<main id="map" class="view"></main>
<!-- FLIGHT: what the strip does not show. -->
<main id="flight" class="view">
  <section class="cell"><span class="label">NETTO</span><div class="reading"><span class="value netto" id="netto">--</span><span class="unit" data-unit="climb"></span></div></section>
  <section class="cell"><span class="label">THM</span><div class="reading"><span class="value thm" id="thm">--</span><span class="unit" data-unit="climb"></span></div></section>
  <section class="cell"><span class="label">AGL</span><div class="reading"><span class="value" id="agl">--</span><span class="unit" data-unit="height"></span></div></section>
  <section class="cell"><span class="label">IAS</span><div class="reading"><span class="value" id="ias">--</span><span class="unit" data-unit="speed"></span></div></section>
  <section class="cell"><span class="label">GS</span><div class="reading"><span class="value" id="gs">--</span><span class="unit" data-unit="speed"></span></div></section>
  <section class="cell"><span class="label">TOP</span><div class="reading"><span class="value" id="top">--</span><span class="unit" data-unit="height"></span></div></section>
  <section class="cell wind">
    <span class="label">WIND</span>
    <div class="reading">
      <svg class="arrow" id="wind-arrow" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0,-8 L4,1 L1,1 L1,8 L-1,8 L-1,1 L-4,1 Z"/></svg>
      <span class="value" id="wind">--</span><span class="unit">kt</span>
    </div>
  </section>
</main>
<!-- TASK: the task loaded and the picker (task.js). -->
<main id="task" class="view">
  <section class="panel">
    <div class="head"><span id="task-name">No task loaded</span><span id="task-total"></span></div>
    <ul id="task-remarks"></ul>
    <ol id="task-points"></ol>
    <div id="task-buttons">
      <button type="button" data-cmd="prev_point" title="Back to the point before">&#9664; Prev</button>
      <button type="button" data-cmd="next_point" title="On to the next point">Next &#9654;</button>
      <button type="button" data-cmd="clear_task" title="No task">Clear</button>
    </div>
  </section>
  <section class="panel">
    <div class="head"><span id="task-folder">tasks</span><button type="button" id="task-refresh" title="Read the folder again">&#8635;</button></div>
    <div id="task-note"></div>
    <div id="task-list"></div>
  </section>
</main>
<!-- The Glide Computer (glide.js): a header with its screen and target, the map above, six
     readings below; the three screens GLIDE, INFO and THERMAL change the readings and the zoom. -->
<header id="ghead">
  <button type="button" id="g-screen" title="Next screen">GLIDE</button>
  <button type="button" class="g-step" data-delta="-1" title="Previous target">&#9664;</button>
  <span id="g-to"><span class="to">TO:</span><b id="g-tag" class="ytag"></b><span id="g-name">--</span><span id="g-limit"></span></span>
  <button type="button" class="g-step" data-delta="1" title="Next target">&#9654;</button>
  <button type="button" id="g-task" title="The task: pick one, step its points">TASK</button>
  <span id="g-clock" title="Local time in the simulator">--:--</span>
</header>
<section id="readings">
  <div class="cell"><span class="label"></span><div class="reading"><span class="value">--</span></div></div>
  <div class="cell"><span class="label"></span><div class="reading"><span class="value">--</span></div></div>
  <div class="cell"><span class="label"></span><div class="reading"><span class="value">--</span></div></div>
  <div class="cell"><span class="label"></span><div class="reading"><span class="value">--</span></div></div>
  <div class="cell"><span class="label"></span><div class="reading"><span class="value">--</span></div></div>
  <div class="cell"><span class="label"></span><div class="reading"><span class="value">--</span></div></div>
</section>
<footer id="status">starting</footer>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="format.js"></script>
<script src="flight.js"></script>
<script src="map.js"></script>
<script src="task.js"></script>
<script src="glide.js"></script>
<script src="app.js"></script>
</body>
</html>
